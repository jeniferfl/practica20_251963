<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">	
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>   
        <link rel="stylesheet" href="style.css">     
    </head>
    <body>
        <div class="jira-card">
            <h3>Backlog de desarrollo</h3>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Añadir una tarea...">
                <button id="addBtn" class="btn-add" onclick="clickbtn()">Crear</button>
            </div>
            <ul class="task-list" id="taskList">

            </ul>
            <script>
                /**function clickbtn(){
                    alert('Soy el boton y me hicieron click');
                }
                */
                let tasks = [];

                const input = document.querySelector('input');
                const addBtn = document.querySelector('.btn-add');
                const lista = document.getElementById('taskList');

                input.addEventListener("keydown", (e)=>{
                    if(e.key === "Enter"){
                        addTask();
                    }
                })

                addBtn.addEventListener('click', addTask);



                function addTask(){
                    if(input.value.trim() === '') return; // Evita agregar tareas vacías
                    
                    const newTask = {
                        text: input.value.trim(),
                        id: Date.now(),
                        completed: false
                    }
                    tasks.push(newTask);
                    input.value = '';

                    console.log(tasks);
                    render();
                }
                function render(){
                    lista.innerHTML = '';
                    tasks.forEach(t => {
                        const li = document.createElement('li');
                        const p = document.createElement('p');
                        const text = document.createTextNode(t.text);

                        p.appendChild(text);
                        li.appendChild(p);
                        lista.appendChild(li);

                    });
                }
        </script type="module" src="">
    </body>
</html>
